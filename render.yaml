# CRUZA 3: servicio funcional FastAPI + SQLite con disco persistente.
# Este archivo NO crea recursos por sí mismo: la activación en Render requiere
# que el propietario conecte el repositorio y acepte los posibles cargos del plan.
services:
  - type: web
    name: cruza3-campus
    runtime: python
    plan: 0.5c-512mb
    region: oregon
    branch: main
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/session
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: CRUZA_DB_PATH
        value: /opt/render/project/src/data/cruza.sqlite3
      - key: CRUZA_DEMO_MODE
        value: "0"
      - key: CRUZA_HTTPS
        value: "1"
    disk:
      name: cruza3-datos
      mountPath: /opt/render/project/src/data
      sizeGB: 1
