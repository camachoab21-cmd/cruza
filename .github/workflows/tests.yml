name: Pruebas de CRUZA 3
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      CRUZA_DEMO_MODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
      - name: Revisar sintaxis Python
        run: python -m compileall -q app
      - name: Probar API, roles y lógica académica
        run: python -m pytest -q
      - name: Comprobar sintaxis del frontend
        run: |
          node --check app/static/app.js
          node --check app/static/cruza-tools.js
          node --check app/static/cruza-ux.js
      - name: Preparar navegador Chromium para revisar interfaz
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Regresiones visuales de acceso, crucigrama y filtros
        run: python tests/ui_regressions.py
      - name: Recorrido navegador con FastAPI y SQLite aislados
        run: python tests/e2e_navegador_servidor.py
      - name: Auditar pantallas y dispositivos
        run: python tests/ui_full_audit.py
      - name: Vista pública fiel a CRUZA 3
        run: python tests/ui_static_preview.py
      - name: Comprobar gesto de lápiz y crayón
        run: python tests/ui_gesture_audit.py
      - name: Prueba exhaustiva de acciones, formularios y recuperación
        run: python tests/ui_actions_audit.py
      - name: Probar escritura fluida, ayuda y controles tipográficos
        run: python tests/ui_ux_audit.py
      - name: Construir paquete offline para Windows
        run: |
          python scripts/build_expo_package.py
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          package=Path('dist/CRUZA3-EXPOSICION-24NOV.zip')
          assert package.is_file() and package.stat().st_size > 100000
          with ZipFile(package) as z:
              names=z.namelist()
              assert z.testzip() is None
              assert 'CRUZA3-EXPOSICION/ABRIR-CRUZA.bat' in names
              assert 'CRUZA3-EXPOSICION/app/main.py' in names
              assert 'CRUZA3-EXPOSICION/app/templates/index.html' in names
              assert 'CRUZA3-EXPOSICION/docs/EXPOSICION-24NOV-2026.md' in names
              assert not any('/data/' in n or n.endswith(('.db','.sqlite3','.env')) for n in names)
              print('ZIP listo: archivos de aplicación y documentación sin base privada')
          PY
      - name: Publicar copia descargable de CRUZA 3
        uses: actions/upload-artifact@v4
        with:
          name: CRUZA3-EXPOSICION-24NOV
          path: dist/CRUZA3-EXPOSICION-24NOV.zip
          if-no-files-found: error
          retention-days: 14
      - name: Guardar capturas e informes de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cruza3-auditoria-visual
          path: docs/auditoria/
          if-no-files-found: warn
