</style><body><div id="app"></div><div id="announcer" aria-live="polite"></div><script>
'use strict';
const $=s=>document.querySelector(s);const app=$('#app');
const courses=[{id:'web',word:'WEB',name:'Desarrollo web',credits:3,day:0,hour:8,room:'B-302',teacher:'Laura Ríos',grades:[4.5,4.3,4.7],clue:'Ideas que cobran vida en el navegador.'},{id:'datos',word:'DATOS',name:'Bases de datos',credits:3,day:1,hour:10,room:'C-204',teacher:'Andrés Mora',grades:[4.2,4.6,4.4],clue:'Información que encuentra su lugar.'},{id:'redes',word:'REDES',name:'Redes de computadores',credits:3,day:2,hour:8,room:'B-105',teacher:'Sara Luna',grades:[3.7,4.1,4.2],clue:'El arte de conectar puntos.'},{id:'calculo',word:'CALCULO',name:'Cálculo diferencial',credits:4,day:3,hour:10,room:'A-201',teacher:'Diego Paz',grades:[3.8,4.0,4.3],clue:'Una pista para entender el cambio.'},{id:'etica',word:'ETICA',name:'Ética profesional',credits:2,day:4,hour:8,room:'A-108',teacher:'Ana Sol',grades:[4.8,4.7,4.9],clue:'La brújula detrás de cada decisión.'},{id:'algebra',word:'ALGEBRA',name:'Álgebra lineal',credits:3,day:0,hour:8,room:'A-306',teacher:'Juan Valle',grades:[4.0,3.9,4.1],clue:'Vectores que abren nuevas direcciones.'}];
let state={route:'login',selected:['web','datos','redes'],enrolled:['web','datos','redes'],confirmed:false,groups:{},cut:'final',day:0,visited:new Set(),sim:4};
const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];const labels={inicio:'Mi tablero',matricula:'Matrícula',horario:'Horario',notas:'Notas'};const fmt=n=>n.toFixed(2).replace('.',',');
const word=(s,cls='')=>`<span class="word ${cls}" aria-label="${s}">${[...s].map(c=>`<span class="letter" aria-hidden="true">${c}</span>`).join('')}</span>`;
function brand(){return '<div class="brand"><div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div><strong>cruza.</strong><small>ACADEMUSOFT · CONCEPTO</small></div></div>'}
function board(interactive=true){let cells={};let words=[['MATRICULA',4,1,0,'matricula',1],['HORARIO',2,4,1,'horario',2],['NOTAS',8,3,0,'notas',3],['CRUZA',6,3,0,'inicio',4]];for(let [w,r,c,v,route,num] of words)[...w].forEach((l,i)=>{let key=(r+(v?i:0))*11+c+(v?0:i);if(!cells[key])cells[key]={l,route,num:i===0?num:''}});return `<div class="crossword" aria-label="Crucigrama de navegación">${Array.from({length:110},(_,i)=>{let c=cells[i];return c?`<${interactive?'button':'span'} class="cell ${c.route==='matricula'?'chosen':''}" ${interactive?`data-route="${c.route}" aria-label="Abrir ${labels[c.route]}"`:''}><small>${c.num}</small>${c.l}</${interactive?'button':'span'}>`:'<span class="cell void"></span>'}).join('')}</div>`}
function login(){return `<div class="login"><section class="loginart gridpaper">${brand()}<div><div class="eyebrow">EDICIÓN 01 / TU VIDA ACADÉMICA</div><h1>Todo conecta.<br><em>Empieza contigo.</em></h1><p class="muted">Cada materia, una palabra.<br>Cada semestre, una nueva conexión.</p></div>${board(false)}<div class="footer"><span>Diseñado para imaginar otra experiencia UTS.</span><span>2026 / CONCEPTO</span></div></section><section class="loginform"><span class="badge" style="align-self:start"><span class="dot"></span>PROTOTIPO INDEPENDIENTE · NO OFICIAL</span><h2>Tu primera pista.</h2><p class="muted">Cruza la puerta a tu próximo semestre.</p><label>Perfil de demostración</label><div class="fakeuser">◧ &nbsp; Alex · Estudiante ficticio</div><label for="letter0">01 horizontal · 6 letras</label><p style="font-size:17px;margin:0">“Aprender también es una forma de…”</p><form id="loginForm"><div class="answer">${Array.from({length:6},(_,i)=>`<input id="letter${i}" aria-label="Letra ${i+1} de 6" maxlength="1" autocomplete="off" autocapitalize="characters" inputmode="text">`).join('')}</div><p class="error" id="loginError" role="alert"></p><button class="solid wide" type="submit">Resolver y entrar &nbsp; ↗</button></form><button data-action="hint" style="border:0;margin-top:10px">Revelar pista: CRECER</button><button class="wide" data-action="enter">Entrar directamente a la demo →</button><p class="mini muted" style="margin-top:24px">Este acceso es un juego. No solicita usuario, correo ni contraseña reales. Todos los datos son ficticios y se reinician al recargar.</p></section></div>`}
function shell(content){return `<div class="shell"><aside class="sidebar">${brand()}<div class="eyebrow muted">PISTAS DEL SEMESTRE</div><nav aria-label="Navegación principal">${Object.entries(labels).map(([r,l],i)=>`<button class="navbtn ${state.route===r?'active':''}" data-route="${r}" ${state.route===r?'aria-current="page"':''}><b>0${i+1}</b>${l}</button>`).join('')}</nav><div class="bottom"><div class="panel lime" style="padding:17px"><span class="eyebrow">UNA PISTA</span><p class="mini" style="margin-top:10px">Las mejores conexiones empiezan con curiosidad.</p></div><button data-action="help" style="border:0;width:100%;margin:15px 0">Cómo jugar ↗</button><div class="profile"><span class="avatar">AL</span><span><b>Alex López</b><br><span class="muted">Perfil de ejemplo</span></span></div><button data-action="logout" style="border:0;font-size:12px;margin-top:12px">Salir de la demo ↗</button></div></aside><main class="main"><header class="topbar row"><span class="eyebrow">MI CAMPUS / ${labels[state.route].toUpperCase()}</span><span class="mobilebrand">cruza.</span><div class="row"><span class="badge"><span class="dot"></span>2026–2 · DEMOSTRACIÓN</span><button data-action="help" aria-label="Ayuda" style="padding:7px 12px">?</button><button data-action="logout" aria-label="Salir de la demo" style="padding:7px 12px">↗</button></div></header>${content}<footer class="footer"><span>CRUZA / Concepto académico independiente para concurso UTS.</span><span>Datos ficticios · Sin conexión institucional</span></footer></main></div>`}
function heading(n,title,desc,extra=''){return `<div class="heading"><div class="eyebrow muted" style="margin-bottom:14px">${n} / ${labels[state.route].toUpperCase()}</div><div class="row"><h1>${title}</h1>${extra}</div><p class="muted">${desc}</p></div>`}
function credits(ids){return courses.filter(c=>ids.includes(c.id)).reduce((s,c)=>s+c.credits,0)}
function home(){return heading('01','Tu semestre.<br><em>Todas las piezas.</em>','Hola, Alex. Sigue una pista y encuentra tu próximo paso.')+`<div class="split"><section class="boardwrap gridpaper"><div class="row"><span class="eyebrow">EL MAPA DE TUS CONEXIONES</span><span class="badge" style="background:var(--paper)">↗ EXPLORA</span></div>${board()}<div class="row mini"><span>Elige una palabra para abrir su sección.</span><span class="mono">4 conexiones</span></div></section><section class="panel"><div class="row"><h2>Las pistas de hoy</h2><span class="eyebrow">HORIZ. / VERT.</span></div>${[['matricula','01','Dale forma a tu semestre','Elige las materias que completan tu camino.'],['horario','02','Encuentra tu momento','Cada clase tiene una casilla en tu semana.'],['notas','03','Lee tus avances','Tus resultados cuentan una historia.']].map(([r,n,t,d])=>`<div class="clue"><span class="num">${n}</span><div><h3>${t}</h3><p class="muted">${d}</p></div><button data-route="${r}" aria-label="Abrir ${labels[r]}">↗</button></div>`).join('')}<div class="panel purple" style="margin-top:22px;padding:18px"><div class="eyebrow">PISTA PERSONAL</div><p style="margin-top:9px">Tu futuro no está escrito.<br><strong>Está por conectar.</strong></p></div></section></div><div class="stats"><div class="stat"><span class="eyebrow">CASILLAS ELEGIDAS</span><strong>${state.enrolled.length}</strong><small>materias ${state.confirmed?'confirmadas':'de ejemplo'}</small></div><div class="stat"><span class="eyebrow">TU PRÓXIMO NIVEL</span><strong>${credits(state.enrolled)}<span style="font-size:17px" class="muted"> / 18</span></strong><small>créditos del tablero</small></div><div class="stat lime"><span class="eyebrow">PROMEDIO DEMO</span><strong>${fmt(average())}</strong><small>cada avance cuenta ↗</small></div></div>`}
function slot(c){return state.groups[c.id]==='B'?{day:4,hour:12}:{day:c.day,hour:c.hour}}
function problems(){let ids=state.selected,errors=[];if(!ids.length)errors.push('Selecciona al menos una materia para completar una palabra.');if(credits(ids)>18)errors.push('Este tablero admite hasta 18 créditos.');for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){let a=courses.find(c=>c.id===ids[i]),b=courses.find(c=>c.id===ids[j]),x=slot(a),y=slot(b);if(x.day===y.day&&x.hour===y.hour)errors.push(`${a.name} y ${b.name} se cruzan a la misma hora. Cambia un grupo o retira una materia.`)}return errors}
function enrollment(){let errors=problems();return heading('02','Arma tu <em>semestre.</em>','Cada materia completa una palabra. Cada elección abre un camino.')+`<div class="steps"><span>01 ELEGIR PALABRAS</span><span>→ 02 REVISAR CRUCES</span><span>→ 03 CONFIRMAR</span></div><div class="enroll"><section class="courses">${courses.map((c,i)=>{let on=state.selected.includes(c.id),s=slot(c);return `<article class="course ${on?'selected':''}"><div class="row"><span class="eyebrow">0${i+1} HORIZONTAL</span><span class="badge">${c.credits} créditos</span></div><h3>${c.name}</h3><p class="muted">${c.clue}</p>${word(c.word)}<p>${days[s.day]} · ${s.hour}:00–${s.hour+2}:00 · ${c.room}</p><div class="row"><select aria-label="Grupo de ${c.name}" data-group="${c.id}"><option value="A" ${state.groups[c.id]!=='B'?'selected':''}>Grupo A · horario base</option><option value="B" ${state.groups[c.id]==='B'?'selected':''}>Grupo B · vie. 12:00</option></select><button data-toggle="${c.id}" aria-pressed="${on}" class="${on?'lime':''}">${on?'✓ Elegida':'＋ Elegir'}</button></div></article>`}).join('')}</section><aside class="panel"><div class="eyebrow">TU COMPOSICIÓN</div><h2 style="margin-top:18px">${state.selected.length} palabras.<br><em>Un nuevo capítulo.</em></h2><div class="progress"><i style="width:${Math.min(100,credits(state.selected)/18*100)}%"></i></div><div class="row mini"><span>${credits(state.selected)} créditos elegidos</span><span>18 máx.</span></div><div style="margin:20px 0">${state.selected.map(id=>{let c=courses.find(c=>c.id===id);return `<div class="listrow mini"><span>${c.name}</span><b>${c.credits}</b></div>`}).join('')||'<p class="muted mini">El tablero está vacío. Elige tu primera materia.</p>'}</div><div aria-live="polite">${errors.length?errors.map(e=>`<p class="error">${e}</p>`).join(''):'<p class="mini">✓ Sin cruces de horario</p>'}</div><button class="solid wide" data-action="review" ${errors.length?'disabled':''}>Revisar mi matrícula →</button><p class="mini muted" style="margin-top:15px">Reglas ficticias de la demo: máximo 18 créditos y sin clases simultáneas. No representa el proceso oficial.</p></aside></div>`}
function schedule(){let enrolled=courses.filter(c=>state.enrolled.includes(c.id));return heading('03','Tu semana, <em>resuelta.</em>','Encuentra cada clase en el lugar donde todo encaja.',`<button data-action="download">↓ Descargar horario</button>`)+`<div class="row" style="margin-bottom:23px"><span class="badge">${state.confirmed?'✓ Matrícula demo confirmada':'◧ Horario de ejemplo'} · ${credits(state.enrolled)} créditos</span><span class="mini muted">Semana tipo / 2026–2</span></div><section class="panel"><div class="row" style="margin-bottom:20px"><h2 style="margin:0">Cruces de la semana</h2><span class="eyebrow">LUN — VIE</span></div><div class="tablewrap"><div class="timetable"><div class="timehead">HORA</div>${days.map(d=>`<div class="timehead">${d}</div>`).join('')}${[8,10,12,14].map(h=>`<div class="time">${h}:00<br><span class="muted">${h+2}:00</span></div>${days.map((d,di)=>{let c=enrolled.find(c=>{let s=confirmedSlot(c);return s.day===di&&s.hour===h});return c?`<button class="slot booked" data-course="${c.id}" aria-label="${c.name}, ${d} ${h}:00"><span class="eyebrow">${c.word}</span><strong>${c.name}</strong><span>${h}:00–${h+2}:00 · ${c.room}</span></button>`:'<div class="slot"><span class="muted">·</span></div>'}).join('')}`).join('')}</div></div><div class="agenda"><div class="tabs" aria-label="Día de la semana">${days.map((d,i)=>`<button data-day="${i}" class="${state.day===i?'active':''}" style="padding:9px">${d.slice(0,3)}</button>`).join('')}</div>${enrolled.filter(c=>confirmedSlot(c).day===state.day).map(c=>`<button class="slot booked" data-course="${c.id}"><span class="eyebrow">${c.word} / ${confirmedSlot(c).hour}:00</span><strong>${c.name}</strong><span>${c.room} · Ver pista de la clase ↗</span></button>`).join('')||'<div class="panel gridpaper"><h3>Una casilla libre.</h3><p>Hoy no hay clases en tu horario. Deja espacio para una nueva idea.</p></div>'}</div></section><div class="panel purple" style="margin-top:22px"><div class="row"><div><span class="eyebrow">PISTA DE ORGANIZACIÓN</span><p style="margin:8px 0 0">Los espacios libres también forman parte del tablero.</p></div><button data-route="matricula">Editar matrícula ↗</button></div></div>`}
let enrolledGroups={};function confirmedSlot(c){return enrolledGroups[c.id]==='B'?{day:4,hour:12}:{day:c.day,hour:c.hour}}
function final(c){return c.grades[0]*.3+c.grades[1]*.3+c.grades[2]*.4}function average(){let cs=courses.filter(c=>state.enrolled.includes(c.id));return cs.reduce((s,c)=>s+final(c)*c.credits,0)/(credits(state.enrolled)||1)}
function grades(){let cs=courses.filter(c=>state.enrolled.includes(c.id));return heading('04','Cada avance <em>cuenta.</em>','Las pistas de tu esfuerzo, reunidas en un solo tablero.')+`<div class="tabs" style="margin-bottom:24px">${[['final','Vista completa'],['0','Corte 1 · 30%'],['1','Corte 2 · 30%'],['2','Corte 3 · 40%']].map(([v,l])=>`<button data-cut="${v}" class="${state.cut===v?'active':''}" aria-pressed="${state.cut===v}">${l}</button>`).join('')}</div><div class="gradegrid"><section class="panel"><h2>Tus palabras completadas</h2><p class="mini muted">Escala de ejemplo: 0,0 a 5,0 · aprobación desde 3,0.</p><table class="grades"><thead><tr><th>MATERIA</th>${state.cut==='final'?'<th>C1</th><th>C2</th><th>C3</th>':''}<th>${state.cut==='final'?'FINAL':'CORTE '+(Number(state.cut)+1)}</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${c.name}</b><br><span class="muted">${c.credits} créditos · ${c.word}</span></td>${state.cut==='final'?c.grades.map(g=>`<td>${fmt(g)}</td>`).join(''):''}<td><span class="grade">${fmt(state.cut==='final'?final(c):c.grades[+state.cut])}</span></td></tr>`).join('')}</tbody></table><div class="clue"><span class="num">✓</span><div><h3>Vas conectando ideas.</h3><p class="muted">Cada resultado es una pista para seguir aprendiendo.</p></div></div></section><aside class="stack"><section class="panel dark" style="text-align:center"><span class="eyebrow">PROMEDIO PONDERADO DEMO</span><div class="ring"><strong>${fmt(average())}</strong></div><p class="mini">Ponderado por créditos de las materias de tu tablero.</p></section><section class="panel peach"><span class="eyebrow">EXPLORA UNA POSIBILIDAD</span><h3 style="margin-top:16px">La última casilla de Web</h3><p class="mini">Con 4,5 en C1 y 4,3 en C2, ¿qué pasa si tu C3 es…?</p><label for="sim" class="row"><span>Nota del tercer corte</span><b id="simValue">${fmt(state.sim)}</b></label><input id="sim" class="slider" type="range" min="0" max="5" step="0.1" value="${state.sim}"><p class="mini" style="margin-top:12px">Final simulado: <strong id="simResult">${fmt(4.5*.3+4.3*.3+state.sim*.4)}</strong></p><span class="mini muted">Exploración libre. No modifica tus notas.</span></section></aside></div>`}
function render(){app.innerHTML=state.route==='login'?login():shell(({inicio:home,matricula:enrollment,horario:schedule,notas:grades})[state.route]());if(state.route==='login')bindLogin()}
function go(r){state.route=r;state.visited.add(r);render();window.scrollTo(0,0)}
function toast(t){$('#announcer').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('#announcer').innerHTML='',3200)}
let lastFocus;function modal(content){lastFocus=document.activeElement;let wrap=document.createElement('div');wrap.className='overlay';wrap.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><span class="eyebrow">CRUZA / DEMOSTRACIÓN</span><button data-action="close" aria-label="Cerrar diálogo">✕</button></div>${content}</section>`;document.body.append(wrap);wrap.querySelector('button').focus()}
function closeModal(){document.querySelector('.overlay')?.remove();if(lastFocus?.isConnected)lastFocus.focus()}
function bindLogin(){$('#loginForm').onsubmit=e=>{e.preventDefault();let answer=[...document.querySelectorAll('.answer input')].map(i=>i.value).join('').toUpperCase();if(answer==='CRECER')go('inicio');else $('#loginError').textContent='Todavía falta una conexión. Pista: la palabra es CRECER.'};document.querySelectorAll('.answer input').forEach((input,i)=>{input.oninput=()=>{input.value=input.value.replace(/[^a-z]/gi,'').toUpperCase();if(input.value)$('#letter'+(i+1))?.focus()};input.onkeydown=e=>{if(e.key==='Backspace'&&!input.value)$('#letter'+(i-1))?.focus();if(e.key==='ArrowLeft')$('#letter'+(i-1))?.focus();if(e.key==='ArrowRight')$('#letter'+(i+1))?.focus()}})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.route)return go(b.dataset.route);if(b.dataset.toggle){let id=b.dataset.toggle;state.selected=state.selected.includes(id)?state.selected.filter(x=>x!==id):[...state.selected,id];render();return}if(b.dataset.day){state.day=+b.dataset.day;render();return}if(b.dataset.cut){state.cut=b.dataset.cut;render();return}if(b.dataset.course){let c=courses.find(c=>c.id===b.dataset.course),s=confirmedSlot(c);modal(`<h2 id="modalTitle">${c.name}</h2>${word(c.word)}<p style="margin-top:22px">${c.clue}</p><div class="listrow"><span>Cuándo</span><b>${days[s.day]} ${s.hour}:00–${s.hour+2}:00</b></div><div class="listrow"><span>Dónde</span><b>Aula ${c.room}</b></div><div class="listrow"><span>Docente ficticio</span><b>${c.teacher}</b></div><p class="mini muted" style="margin-top:20px">Información simulada para el prototipo.</p>`);return}switch(b.dataset.action){case'enter':go('inicio');break;case'hint':[...'CRECER'].forEach((l,i)=>$('#letter'+i).value=l);$('#loginError').textContent='Pista completa. Ya puedes entrar.';break;case'logout':go('login');break;case'close':closeModal();break;case'help':modal(`<h2 id="modalTitle">La pista está en conectar.</h2><p>CRUZA convierte la gestión académica en un crucigrama: elige una palabra del tablero o usa el menú para entrar a cada sección.</p><div class="clue"><span class="num">01</span><p><b>Matrícula:</b> elige materias. Si dos clases se cruzan, cambia un grupo. Revisa y confirma.</p></div><div class="clue"><span class="num">02</span><p><b>Horario:</b> descubre cómo se acomodan tus elecciones. Toca una clase para ver sus detalles.</p></div><div class="clue"><span class="num">03</span><p><b>Notas:</b> consulta cortes y prueba una posibilidad con el simulador.</p></div><p class="mini muted" style="margin-top:18px">Concepto independiente. No es Academusoft oficial ni un servicio de la UTS. No guarda información, no solicita credenciales y no realiza matrículas reales. Recarga para reiniciar.</p>`);break;case'review':if(problems().length)return;modal(`<h2 id="modalTitle">¿Encajan todas tus piezas?</h2><p class="muted">Revisa tus palabras antes de cerrar el tablero.</p>${state.selected.map(id=>{let c=courses.find(c=>c.id===id),s=slot(c);return `<div class="listrow"><span><b>${c.name}</b><br><small>${days[s.day]} · ${s.hour}:00 · Grupo ${state.groups[id]||'A'}</small></span><b>${c.credits} cr.</b></div>`}).join('')}<div class="listrow"><b>Total</b><b>${credits(state.selected)} créditos</b></div><p class="mini muted">Confirmación simulada. No genera pagos ni registros institucionales.</p><button class="solid wide" data-action="confirm">Confirmar matrícula demo ✓</button>`);break;case'confirm':if(problems().length)return;state.enrolled=[...state.selected];enrolledGroups={...state.groups};state.confirmed=true;closeModal();modal(`<h2 id="modalTitle">Todo encaja.</h2>${word('LISTO','successword')}<p>Tu matrícula de demostración quedó completa: <b>${state.enrolled.length} materias y ${credits(state.enrolled)} créditos.</b></p><p class="muted">El horario ya tiene una casilla para cada elección.</p><button class="solid wide" data-action="seeSchedule">Descubrir mi horario →</button>`);break;case'seeSchedule':closeModal();go('horario');break;case'download':downloadSchedule();break}});
document.addEventListener('change',e=>{if(e.target.dataset.group){state.groups[e.target.dataset.group]=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='sim'){state.sim=+e.target.value;$('#simValue').textContent=fmt(state.sim);$('#simResult').textContent=fmt(4.5*.3+4.3*.3+state.sim*.4)}});
document.addEventListener('keydown',e=>{let modalEl=document.querySelector('.modal');if(!modalEl)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let f=[...modalEl.querySelectorAll('button,input,select,a[href]')],first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
function downloadSchedule(){let text='CRUZA · HORARIO DE DEMOSTRACIÓN\nConcepto independiente, no oficial. Datos ficticios.\n\n'+courses.filter(c=>state.enrolled.includes(c.id)).sort((a,b)=>confirmedSlot(a).day-confirmedSlot(b).day).map(c=>{let s=confirmedSlot(c);return `${days[s.day]} | ${s.hour}:00–${s.hour+2}:00 | ${c.name} | ${c.room}`}).join('\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='CRUZA-horario-demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Horario de demostración descargado.')}
render();
</script></body></html>
