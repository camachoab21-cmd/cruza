</style><body><div id="app"></div><div id="announcer" aria-live="polite"></div><script>
'use strict';
const $=s=>document.querySelector(s);const app=$('#app');
const courses=[{id:'web',word:'WEB',name:'Desarrollo web',credits:3,day:0,hour:8,room:'B-302',teacher:'Laura Ríos',grades:[4.5,4.3,4.7],clue:'Ideas que cobran vida en el navegador.'},{id:'datos',word:'DATOS',name:'Bases de datos',credits:3,day:1,hour:10,room:'C-204',teacher:'Andrés Mora',grades:[4.2,4.6,4.4],clue:'Información que encuentra su lugar.'},{id:'redes',word:'REDES',name:'Redes de computadores',credits:3,day:2,hour:8,room:'B-105',teacher:'Sara Luna',grades:[3.7,4.1,4.2],clue:'El arte de conectar puntos.'},{id:'calculo',word:'CALCULO',name:'Cálculo diferencial',credits:4,day:3,hour:10,room:'A-201',teacher:'Diego Paz',grades:[3.8,4.0,4.3],clue:'Una pista para entender el cambio.'},{id:'etica',word:'ETICA',name:'Ética profesional',credits:2,day:4,hour:8,room:'A-108',teacher:'Ana Sol',grades:[4.8,4.7,4.9],clue:'La brújula detrás de cada decisión.'},{id:'algebra',word:'ALGEBRA',name:'Álgebra lineal',credits:3,day:0,hour:8,room:'A-306',teacher:'Juan Valle',grades:[4.0,3.9,4.1],clue:'Vectores que abren nuevas direcciones.'}];
let state={route:'login',selected:['web','datos','redes'],enrolled:['web','datos','redes'],confirmed:false,groups:{},cut:'final',day:0,visited:new Set(),sim:4};
const days=['Lunes','Martes','Miércoles','Jueves','Viernes'];const labels={inicio:'Mi tablero',matricula:'Matrícula',horario:'Horario',notas:'Notas'};const fmt=n=>n.toFixed(2).replace('.',',');
const word=(s,cls='')=>`<span class="word ${cls}" aria-label="${s}">${[...s].map(c=>`<span class="letter" aria-hidden="true">${c}</span>`).join('')}</span>`;
function brand(){return '<div class="brand"><div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div><div><strong>cruza.</strong><small>ACADEMUSOFT · CONCEPTO</small></div></div>'}
function board(interactive=true){let cells={};let words=[['MATRICULA',4,1,0,'matricula',1],['HORARIO',2,4,1,'horario',2],['NOTAS',8,3,0,'notas',3],['CRUZA',6,3,0,'inicio',4]];for(let [w,r,c,v,route,num] of words)[...w].forEach((l,i)=>{let key=(r+(v?i:0))*11+c+(v?0:i);if(!cells[key])cells[key]={l,route,num:i===0?num:''}});return `<div class="crossword" aria-label="Crucigrama de navegación">${Array.from({length:110},(_,i)=>{let c=cells[i];return c?`<${interactive?'button':'span'} class="cell ${c.route==='matricula'?'chosen':''}" ${interactive?`data-route="${c.route}" aria-label="Abrir ${labels[c.route]}"`:''}><small>${c.num}</small>${c.l}</${interactive?'button':'span'}>`:'<span class="cell void"></span>'}).join('')}</div>`}
function login(){return `<div class="login"><section class="loginart gridpaper">${brand()}<div><div class="eyebrow">EDICIÓN 01 / TU VIDA ACADÉMICA</div><h1>Todo conecta.<br><em>Empieza contigo.</em></h1><p class="muted">Cada materia, una palabra.<br>Cada semestre, una nueva conexión.</p></div>${board(false)}<div class="footer"><span>Diseñado para imaginar otra experiencia UTS.</span><span>2026 / CONCEPTO</span></div></section><section class="loginform"><span class="badge" style="align-self:start"><span class="dot"></span>PROTOTIPO INDEPENDIENTE · NO OFICIAL</span><h2>Tu primera pista.</h2><p class="muted">Cruza la puerta a tu próximo semestre.</p><label>Perfil de estudiante</label><div class="fakeuser">◧ &nbsp; Alex · Estudiante ficticio</div><label for="letter0">01 horizontal · 6 letras</label><p style="font-size:17px;margin:0">“Aprender también es una forma de…”</p><form id="loginForm"><div class="answer">${Array.from({length:6},(_,i)=>`<input id="letter${i}" aria-label="Letra ${i+1} de 6" maxlength="1" autocomplete="off" autocapitalize="characters" inputmode="text">`).join('')}</div><p class="error" id="loginError" role="alert"></p><button class="solid wide" type="submit">Resolver y entrar &nbsp; ↗</button></form><button data-action="hint" style="border:0;margin-top:10px">Revelar pista: CRECER</button><button class="wide" data-action="enter">Entrar directamente a la demo →</button><p class="mini muted" style="margin-top:24px">Este acceso es un juego. No solicita usuario, correo ni contraseña reales. Los datos son ficticios. La matrícula confirmada se conserva en este navegador.</p></section></div>`}
function shell(content){return `<div class="shell"><aside class="sidebar">${brand()}<div class="eyebrow muted">PISTAS DEL SEMESTRE</div><nav aria-label="Navegación principal">${Object.entries(labels).map(([r,l],i)=>`<button class="navbtn ${state.route===r?'active':''}" data-route="${r}" ${state.route===r?'aria-current="page"':''}><b>0${i+1}</b>${l}</button>`).join('')}</nav><div class="bottom"><div class="panel lime" style="padding:17px"><span class="eyebrow">UNA PISTA</span><p class="mini" style="margin-top:10px">Las mejores conexiones empiezan con curiosidad.</p></div><button data-action="help" style="border:0;width:100%;margin:15px 0">Cómo jugar ↗</button><div class="profile"><span class="avatar">AL</span><span><b>Alex López</b><br><span class="muted">Perfil de ejemplo</span></span></div><button data-action="logout" style="border:0;font-size:12px;margin-top:12px">Salir de la demo ↗</button></div></aside><main class="main"><header class="topbar row"><span class="eyebrow">MI CAMPUS / ${labels[state.route].toUpperCase()}</span><span class="mobilebrand">cruza.</span><div class="row"><span class="badge"><span class="dot"></span>2026–2 · PREGRADO</span><button data-action="help" aria-label="Ayuda" style="padding:7px 12px">?</button><button data-action="logout" aria-label="Salir de la demo" style="padding:7px 12px">↗</button></div></header>${content}<footer class="footer"><span>CRUZA / Concepto académico independiente para concurso UTS.</span><span>Prototipo independiente · No oficial · Datos ficticios</span></footer></main></div>`}
function heading(n,title,desc,extra=''){return `<div class="heading"><div class="eyebrow muted" style="margin-bottom:14px">${n} / ${labels[state.route].toUpperCase()}</div><div class="row"><h1>${title}</h1>${extra}</div><p class="muted">${desc}</p></div>`}
function credits(ids){return courses.filter(c=>ids.includes(c.id)).reduce((s,c)=>s+c.credits,0)}
function home(){return heading('01','Tu semestre.<br><em>Todas las piezas.</em>','Hola, Alex. Sigue una pista y encuentra tu próximo paso.')+`<div class="split"><section class="boardwrap gridpaper"><div class="row"><span class="eyebrow">EL MAPA DE TUS CONEXIONES</span><span class="badge" style="background:var(--paper)">↗ EXPLORA</span></div>${board()}<div class="row mini"><span>Elige una palabra para abrir su sección.</span><span class="mono">4 conexiones</span></div></section><section class="panel"><div class="row"><h2>Las pistas de hoy</h2><span class="eyebrow">HORIZ. / VERT.</span></div>${[['matricula','01','Dale forma a tu semestre','Elige las materias que completan tu camino.'],['horario','02','Encuentra tu momento','Cada clase tiene una casilla en tu semana.'],['notas','03','Lee tus avances','Tus resultados cuentan una historia.']].map(([r,n,t,d])=>`<div class="clue"><span class="num">${n}</span><div><h3>${t}</h3><p class="muted">${d}</p></div><button data-route="${r}" aria-label="Abrir ${labels[r]}">↗</button></div>`).join('')}<div class="panel purple" style="margin-top:22px;padding:18px"><div class="eyebrow">PISTA PERSONAL</div><p style="margin-top:9px">Tu futuro no está escrito.<br><strong>Está por conectar.</strong></p></div></section></div><div class="stats"><div class="stat"><span class="eyebrow">CASILLAS ELEGIDAS</span><strong>${state.enrolled.length}</strong><small>materias ${state.confirmed?'confirmadas':'de ejemplo'}</small></div><div class="stat"><span class="eyebrow">TU PRÓXIMO NIVEL</span><strong>${credits(state.enrolled)}<span style="font-size:17px" class="muted"> / 18</span></strong><small>créditos del tablero</small></div><div class="stat lime"><span class="eyebrow">PROMEDIO ACADÉMICO</span><strong>${fmt(average())}</strong><small>cada avance cuenta ↗</small></div></div>`}
function slot(c){return state.groups[c.id]==='B'?{day:4,hour:12}:{day:c.day,hour:c.hour}}
function problems(){let ids=state.selected,errors=[];if(!ids.length)errors.push('Selecciona al menos una materia para completar una palabra.');if(credits(ids)>18)errors.push('Este tablero admite hasta 18 créditos.');for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){let a=courses.find(c=>c.id===ids[i]),b=courses.find(c=>c.id===ids[j]),x=slot(a),y=slot(b);if(x.day===y.day&&x.hour===y.hour)errors.push(`${a.name} y ${b.name} se cruzan a la misma hora. Cambia un grupo o retira una materia.`)}return errors}
function enrollment(){let errors=problems();return heading('02','Arma tu <em>semestre.</em>','Cada materia completa una palabra. Cada elección abre un camino.')+`<div class="steps"><span>01 ELEGIR PALABRAS</span><span>→ 02 REVISAR CRUCES</span><span>→ 03 CONFIRMAR</span></div><div class="enroll"><section class="courses">${courses.map((c,i)=>{let on=state.selected.includes(c.id),s=slot(c);return `<article class="course ${on?'selected':''}"><div class="row"><span class="eyebrow">0${i+1} HORIZONTAL</span><span class="badge">${c.credits} créditos</span></div><h3>${c.name}</h3><p class="muted">${c.clue}</p>${word(c.word)}<p>${days[s.day]} · ${s.hour}:00–${s.hour+2}:00 · ${c.room}</p><div class="row"><select aria-label="Grupo de ${c.name}" data-group="${c.id}"><option value="A" ${state.groups[c.id]!=='B'?'selected':''}>Grupo A · horario base</option><option value="B" ${state.groups[c.id]==='B'?'selected':''}>Grupo B · vie. 12:00</option></select><button data-toggle="${c.id}" aria-pressed="${on}" class="${on?'lime':''}">${on?'✓ Elegida':'＋ Elegir'}</button></div></article>`}).join('')}</section><aside class="panel"><div class="eyebrow">TU COMPOSICIÓN</div><h2 style="margin-top:18px">${state.selected.length} palabras.<br><em>Un nuevo capítulo.</em></h2><div class="progress"><i style="width:${Math.min(100,credits(state.selected)/18*100)}%"></i></div><div class="row mini"><span>${credits(state.selected)} créditos elegidos</span><span>18 máx.</span></div><div style="margin:20px 0">${state.selected.map(id=>{let c=courses.find(c=>c.id===id);return `<div class="listrow mini"><span>${c.name}</span><b>${c.credits}</b></div>`}).join('')||'<p class="muted mini">El tablero está vacío. Elige tu primera materia.</p>'}</div><div aria-live="polite">${errors.length?errors.map(e=>`<p class="error">${e}</p>`).join(''):'<p class="mini">✓ Sin cruces de horario</p>'}</div><button class="solid wide" data-action="review" ${errors.length?'disabled':''}>Revisar mi matrícula →</button><p class="mini muted" style="margin-top:15px">Reglas ficticias de la demo: máximo 18 créditos y sin clases simultáneas. No representa el proceso oficial.</p></aside></div>`}
function schedule(){let enrolled=courses.filter(c=>state.enrolled.includes(c.id));return heading('03','Tu semana, <em>resuelta.</em>','Encuentra cada clase en el lugar donde todo encaja.',`<button data-action="download">↓ Descargar horario</button>`)+`<div class="row" style="margin-bottom:23px"><span class="badge">${state.confirmed?'✓ Matrícula confirmada':'◧ Horario preliminar'} · ${credits(state.enrolled)} créditos</span><span class="mini muted">Semana tipo / 2026–2</span></div><section class="panel"><div class="row" style="margin-bottom:20px"><h2 style="margin:0">Cruces de la semana</h2><span class="eyebrow">LUN — VIE</span></div><div class="tablewrap"><div class="timetable"><div class="timehead">HORA</div>${days.map(d=>`<div class="timehead">${d}</div>`).join('')}${[8,10,12,14].map(h=>`<div class="time">${h}:00<br><span class="muted">${h+2}:00</span></div>${days.map((d,di)=>{let c=enrolled.find(c=>{let s=confirmedSlot(c);return s.day===di&&s.hour===h});return c?`<button class="slot booked" data-course="${c.id}" aria-label="${c.name}, ${d} ${h}:00"><span class="eyebrow">${c.word}</span><strong>${c.name}</strong><span>${h}:00–${h+2}:00 · ${c.room}</span></button>`:'<div class="slot"><span class="muted">·</span></div>'}).join('')}`).join('')}</div></div><div class="agenda"><div class="tabs" aria-label="Día de la semana">${days.map((d,i)=>`<button data-day="${i}" class="${state.day===i?'active':''}" style="padding:9px">${d.slice(0,3)}</button>`).join('')}</div>${enrolled.filter(c=>confirmedSlot(c).day===state.day).map(c=>`<button class="slot booked" data-course="${c.id}"><span class="eyebrow">${c.word} / ${confirmedSlot(c).hour}:00</span><strong>${c.name}</strong><span>${c.room} · Ver pista de la clase ↗</span></button>`).join('')||'<div class="panel gridpaper"><h3>Una casilla libre.</h3><p>Hoy no hay clases en tu horario. Deja espacio para una nueva idea.</p></div>'}</div></section><div class="panel purple" style="margin-top:22px"><div class="row"><div><span class="eyebrow">PISTA DE ORGANIZACIÓN</span><p style="margin:8px 0 0">Los espacios libres también forman parte del tablero.</p></div><button data-route="matricula">Editar matrícula ↗</button></div></div>`}
let enrolledGroups={};function confirmedSlot(c){return enrolledGroups[c.id]==='B'?{day:4,hour:12}:{day:c.day,hour:c.hour}}
function final(c){return c.grades[0]*.3+c.grades[1]*.3+c.grades[2]*.4}function average(){let cs=courses.filter(c=>state.enrolled.includes(c.id));return cs.reduce((s,c)=>s+final(c)*c.credits,0)/(credits(state.enrolled)||1)}
function grades(){let cs=courses.filter(c=>state.enrolled.includes(c.id));return heading('04','Cada avance <em>cuenta.</em>','Las pistas de tu esfuerzo, reunidas en un solo tablero.')+`<div class="tabs" style="margin-bottom:24px">${[['final','Vista completa'],['0','Corte 1 · 30%'],['1','Corte 2 · 30%'],['2','Corte 3 · 40%']].map(([v,l])=>`<button data-cut="${v}" class="${state.cut===v?'active':''}" aria-pressed="${state.cut===v}">${l}</button>`).join('')}</div><div class="gradegrid"><section class="panel"><h2>Tus palabras completadas</h2><p class="mini muted">Escala de ejemplo: 0,0 a 5,0 · aprobación desde 3,0.</p><table class="grades"><thead><tr><th>MATERIA</th>${state.cut==='final'?'<th>C1</th><th>C2</th><th>C3</th>':''}<th>${state.cut==='final'?'FINAL':'CORTE '+(Number(state.cut)+1)}</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${c.name}</b><br><span class="muted">${c.credits} créditos · ${c.word}</span></td>${state.cut==='final'?c.grades.map(g=>`<td>${fmt(g)}</td>`).join(''):''}<td><span class="grade">${fmt(state.cut==='final'?final(c):c.grades[+state.cut])}</span></td></tr>`).join('')}</tbody></table><div class="clue"><span class="num">✓</span><div><h3>Vas conectando ideas.</h3><p class="muted">Cada resultado es una pista para seguir aprendiendo.</p></div></div></section><aside class="stack"><section class="panel dark" style="text-align:center"><span class="eyebrow">PROMEDIO PONDERADO</span><div class="ring"><strong>${fmt(average())}</strong></div><p class="mini">Ponderado por créditos de las materias de tu tablero.</p></section><section class="panel peach"><span class="eyebrow">EXPLORA UNA POSIBILIDAD</span><h3 style="margin-top:16px">La última casilla de Web</h3><p class="mini">Con 4,5 en C1 y 4,3 en C2, ¿qué pasa si tu C3 es…?</p><label for="sim" class="row"><span>Nota del tercer corte</span><b id="simValue">${fmt(state.sim)}</b></label><input id="sim" class="slider" type="range" min="0" max="5" step="0.1" value="${state.sim}"><p class="mini" style="margin-top:12px">Final simulado: <strong id="simResult">${fmt(4.5*.3+4.3*.3+state.sim*.4)}</strong></p><span class="mini muted">Exploración libre. No modifica tus notas.</span></section></aside></div>`}

let lastFocus;function modal(content){lastFocus=document.activeElement;let wrap=document.createElement('div');wrap.className='overlay';wrap.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="row"><span class="eyebrow">CRUZA / DEMOSTRACIÓN</span><button data-action="close" aria-label="Cerrar diálogo">✕</button></div>${content}</section>`;document.body.append(wrap);wrap.querySelector('button').focus()}

olicita credenciales ni realiza matrículas reales.</p>`);break;case'review':if(problems().length)return;modal(`<h2 id="modalTitle">¿Encajan todas tus piezas?</h2><p class="muted">Revisa tus palabras antes de cerrar el tablero.</p>${state.selected.map(id=>{let c=courses.find(c=>c.id===id),s=slot(c);return `<div class="listrow"><span><b>${c.name}</b><br><small>${days[s.day]} · ${s.hour}:00 · Grupo ${state.groups[id]||'A'}</small></span><b>${c.credits} cr.</b></div>`}).join('')}<div class="listrow"><b>Total</b><b>${credits(state.selected)} créditos</b></div><p class="mini muted">Confirmación simulada. No genera pagos ni registros institucionales.</p><button class="solid wide" data-action="confirm">Confirmar matrícula ✓</button>`);break;case'confirm':if(problems().length)return;state.enrolled=[...state.selected];enrolledGroups={...state.groups};state.confirmed=true;closeModal();modal(`<h2 id="modalTitle">Todo encaja.</h2>${word('LISTO','successword')}<p>Tu matrícula quedó registrada en este navegador: <b>${state.enrolled.length} materias y ${credits(state.enrolled)} créditos.</b></p><p class="muted">El horario ya tiene una casilla para cada elección.</p><button class="solid wide" data-action="seeSchedule">Descubrir mi horario →</button>`);break;case'seeSchedule':closeModal();go('horario');break;case'download':downloadSchedule();break}});
document.addEventListener('change',e=>{if(e.target.dataset.group){state.groups[e.target.dataset.group]=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='sim'){state.sim=+e.target.value;$('#simValue').textContent=fmt(state.sim);$('#simResult').textContent=fmt(4.5*.3+4.3*.3+state.sim*.4)}});

function downloadSchedule(){let text='CRUZA · HORARIO DE DEMOSTRACIÓN\nConcepto independiente, no oficial. Datos ficticios.\n\n'+courses.filter(c=>state.enrolled.includes(c.id)).sort((a,b)=>confirmedSlot(a).day-confirmedSlot(b).day).map(c=>{let s=confirmedSlot(c);return `${days[s.day]} | ${s.hour}:00–${s.hour+2}:00 | ${c.name} | ${c.room}`}).join('\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='CRUZA-horario-demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Horario de demostración descargado.')}

</style><script>
const cruzaStorage = 'cruza-matricula-v1';
try {
  const saved = JSON.parse(localStorage.getItem(cruzaStorage));
  if (saved && Array.isArray(saved.ids) && saved.ids.length && saved.ids.every(id => courses.some(course => course.id === id))) {
    state.selected = [...saved.ids];
    state.enrolled = [...saved.ids];
    state.groups = Object.fromEntries(saved.ids.map(id => [id, saved.groups?.[id] === 'B' ? 'B' : 'A']));
    enrolledGroups = { ...state.groups };
    state.confirmed = true;
  }
} catch { /* La demo funciona también con almacenamiento desactivado. */ }
const renderCruzaBase = render;
render = function () {
  renderCruzaBase();
  const route = state.route;
  const panel = document.querySelector('.heading');
  if (!panel || route === 'inicio') return;
  const configs = {
    matricula: ['Materias en casillas', 'Pulsa una palabra para añadir o retirar la materia.', courses.map(c => [c.word, c.name, 'toggle', c.id, state.selected.includes(c.id)])],
    horario: ['Semana en casillas', 'Elige un día para ver sus clases.', days.map((day, i) => [day.slice(0, 3).toUpperCase(), day, 'day', String(i), state.day === i])],
    notas: ['Cortes en casillas', 'Elige qué resultados quieres consultar.', [['FINAL','Vista completa','cut','final',state.cut==='final'], ...[0,1,2].map(i => ['C'+(i+1),'Corte '+(i+1),'cut',String(i),state.cut===String(i)])]]
  };
  const [title, hint, keys] = configs[route];
  const section = document.createElement('section');
  section.className = 'panel puzzle-controls';
  section.innerHTML = '<div><span class="eyebrow muted">TABLERO DE ACCIONES</span><h2>'+title+'</h2><p>'+hint+'</p></div><div class="puzzle-words"></div>';
  for (const [label, name, type, value, active] of keys) {
    const key = document.createElement('button');
    key.className = 'puzzle-key';
    key.dataset.puzzle = type;
    key.dataset.value = value;
    key.setAttribute('aria-label', name);
    key.setAttribute('aria-pressed', active);
    key.innerHTML = [...label].map((letter, index) => '<span aria-hidden="true" style="--tile:'+index+'">'+letter+'</span>').join('');
    section.lastElementChild.append(key);
  }
  panel.after(section);
  if (route === 'horario') {
    document.querySelectorAll('.timetable > *').forEach((cell, index) => {
      if (index % 6 === state.day + 1) cell.style.boxShadow = 'inset 0 0 0 2px #a3b47a';
    });
  }

document.addEventListener('click', event => {
  const puzzle = event.target.closest('[data-puzzle]');
  if (puzzle) {
    const { puzzle: type, value } = puzzle.dataset;
    document.querySelector('[data-'+type+'="'+value+'"]').click();
    document.querySelector('[data-puzzle="'+type+'"][data-value="'+value+'"]')?.focus({preventScroll:true});
  }
  if (event.target.closest('[data-action="confirm"]') && state.confirmed && !problems().length) {
    try { localStorage.setItem(cruzaStorage, JSON.stringify({ ids: state.enrolled, groups: enrolledGroups })); } catch {}
  }

function highlightCruzaWord(event, on) {
  const cell = event.target.closest('.crossword button[data-route]');

</style><script>(() => {
  'use strict';
  const storage = 'cruza-campus-v2';
  const defaults = { read: [], reminders: [], calm: false };
  let prefs;
  try { prefs = { ...defaults, ...JSON.parse(localStorage.getItem(storage)) }; }
  catch { prefs = { ...defaults }; }
  for (const key of ['read', 'reminders']) if (!Array.isArray(prefs[key])) prefs[key] = [];
  const save = () => { try { localStorage.setItem(storage, JSON.stringify(prefs)); } catch {} };
  const extra = { historial: 'Historial', calendario: 'Calendario', perfil: 'Perfil', avisos: 'Avisos' };
  Object.assign(labels, extra);
  const events = [
    [10, 'Jornada de proyectos', 'Presentación de prototipos · Auditorio'],
    [16, 'Entrega de laboratorio', 'Desarrollo web · Aula virtual'],
    [20, 'Evaluación de bases de datos', 'Segundo corte · C-204'],
    [27, 'Cierre de actividades', 'Revisa entregas y calificaciones']
  ];
  const notices = [
    ['academico', 'Fechas de evaluación', 'Consulta las evaluaciones y las entregas de noviembre.', 'calendario'],
    ['matricula', 'Revisa tu plan de estudios', 'Confirma las materias para actualizar el horario del semestre.', 'matricula'],
    ['notas', 'Resultados por corte', 'Consulta las ponderaciones y la nota definitiva por materia.', 'notas']
  ];
  const history = [
    ['2026–1', 'Programación I', 3, 4.5], ['2026–1', 'Matemática básica', 3, 4.1], ['2026–1', 'Introducción a sistemas', 2, 4.6],
    ['2025–2', 'Fundamentos de computación', 3, 4.3], ['2025–2', 'Comunicación escrita', 2, 4.4], ['2025–2', 'Lógica', 3, 4.0]
  ];
  let calendarDay = 10;
  let query = '';
  const sections = {
    historial() {
      const total = history.reduce((sum, [, , credits]) => sum + credits, 0);
      const average = history.reduce((sum, [, , credits, grade]) => sum + credits * grade, 0) / total;
      return heading('05', 'Historial <em>académico.</em>', 'Consulta las materias aprobadas y el promedio de los períodos anteriores.') +
        `<div class="v2-grid"><section class="panel lime"><div class="eyebrow">CRÉDITOS APROBADOS</div><h2>${total}</h2>Dos períodos cerrados</section><section class="panel purple"><div class="eyebrow">PROMEDIO ACUMULADO</div><h2>${fmt(average)}</h2>Ponderado por créditos</section></div>` +
        ['2026–1','2025–2'].map(period => `<section class="panel" style="margin-top:16px"><h2>Período ${period}</h2><ul class="v2-list">${history.filter(row => row[0] === period).map(([,name,cr,grade]) => `<li class="row"><div><b>${name}</b><br><small>${cr} créditos · Aprobada</small></div><span class="grade">${fmt(grade)}</span></li>`).join('')}</ul></section>`).join('');
    },
    calendario() {
      const selected = events.find(([day]) => day === calendarDay);
      const cells = Array.from({length:30}, (_,i) => i+1).map(day => `<button data-v2-date="${day}" class="${events.some(e=>e[0]===day)?'has-event':''}" aria-label="${day} de noviembre" aria-pressed="${day===calendarDay}">${day}</button>`).join('');
      return heading('06','Calendario <em>académico.</em>','Noviembre de 2026 · Fechas de referencia de la demostración.') + `<div class="v2-grid"><section class="panel"><h2>Noviembre 2026</h2><div class="v2-calendar">${['L','M','X','J','V','S','D'].map(d=>`<b>${d}</b>`).join('')}${'<span></span>'.repeat(6)}${cells}</div></section><section class="panel purple"><span class="eyebrow">${calendarDay} DE NOVIEMBRE</span><h2>${selected?selected[1]:'Día sin eventos'}</h2>${selected?`<p>${selected[2]}</p><button data-v2-remind="${calendarDay}" aria-pressed="${prefs.reminders.includes(calendarDay)}">${prefs.reminders.includes(calendarDay)?'Quitar de mi agenda':'Guardar en mi agenda'}</button>`:'<p>Selecciona una fecha marcada para ver sus detalles.</p>'}<ul class="v2-list">${events.map(([day,title])=>`<li><button data-v2-date="${day}" class="v2-pill">${day} nov · ${title}${prefs.reminders.includes(day)?' · Guardado':''}</button></li>`).join('')}</ul></section></div>`;
    },
    perfil() {
      return heading('07','Perfil <em>estudiantil.</em>','Datos académicos y preferencias de visualización.') + `<div class="v2-grid"><section class="panel purple"><span class="avatar">AL</span><h2>Alex López</h2><p>Tecnología en Desarrollo de Sistemas Informáticos</p><ul class="v2-list"><li>Código estudiantil · CRZ-0246</li><li>Semestre · 3</li><li>Período activo · 2026–2</li></ul></section><section class="panel"><h2>Preferencias</h2><p><label><input type="checkbox" id="v2-calm" ${prefs.calm?'checked':''}> Reducir animaciones</label></p><button data-v2-reset>Reiniciar demostración</button><p class="mini muted" style="margin-top:10px">Restablece matrícula, avisos, agenda y preferencias de este navegador.</p></section></div>`;
    },
    avisos() {
      return heading('08','Avisos <em>académicos.</em>',`${notices.length-prefs.read.length} avisos sin leer.`) + `<section class="panel"><ul class="v2-list">${notices.map(([id,title,desc,route])=>`<li><div class="row" style="flex-wrap:wrap"><div><h3>${title}</h3><p>${desc}</p></div><span class="badge">${prefs.read.includes(id)?'Leído':'Nuevo'}</span></div><div class="tabs"><button data-route="${route}">Consultar ↗</button>${prefs.read.includes(id)?'':`<button data-v2-read="${id}">Marcar como leído</button>`}</div></li>`).join('')}</ul></section>`;
    }
  };
  function dashboard() {
    const current = courses.filter(c => state.enrolled.includes(c.id));
    const sorted = [...current].sort((a,b) => (confirmedSlot(a).day-confirmedSlot(b).day)*24 + confirmedSlot(a).hour-confirmedSlot(b).hour);
    const next = sorted[0];
    const headingEl = document.querySelector('.heading');
    headingEl.insertAdjacentHTML('afterend', '<section class="panel student-band"><span class="avatar">AL</span><div><b>Alex López</b><br><span class="mini muted">Desarrollo de Sistemas Informáticos · Semestre 3</span></div><span class="badge">'+(state.confirmed?'Matrícula confirmada':'Matrícula en preparación')+'</span></section>');
    document.querySelector('.stats').insertAdjacentHTML('afterend', `<div class="v2-grid" style="margin-top:16px"><section class="panel"><span class="eyebrow">PRIMERA CLASE DE LA SEMANA</span><h2>${next.name}</h2><p>${days[confirmedSlot(next).day]} · ${confirmedSlot(next).hour}:00 · Aula ${next.room}</p><ul class="v2-list">${current.map(c=>`<li>${c.name} · ${c.credits} cr.</li>`).join('')}</ul></section><section class="panel purple"><span class="eyebrow">ACTIVIDAD ACADÉMICA</span><h2>${events[0][1]}</h2><p>${events[0][0]} de noviembre · ${events[0][2]}</p><div class="tabs"><button data-route="calendario">Calendario ↗</button><button data-route="avisos">Avisos (${notices.length-prefs.read.length}) ↗</button></div></section></div>`);
    const board = document.querySelector('.boardwrap');
    const stage = board.parentElement;
    stage.classList.add('edition-stage');
    document.querySelector('main').classList.add('edition-home');
    headingEl.classList.add('edition-title');
    headingEl.innerHTML = '<div><div class="eyebrow edition-kicker">CAMPUS ESTUDIANTIL <span>2026—02</span></div><h1>El semestre, <em>en juego.</em></h1></div><p>Tu matrícula, tus clases y tus resultados se cruzan en un mismo tablero.</p>';
    const band = document.querySelector('.student-band');
    band.classList.add('edition-student');
    const guide = stage.lastElementChild;
    guide.classList.add('edition-guide');
    guide.querySelector('.panel.purple')?.remove();
    guide.querySelector('h2').textContent = 'Elige tu ruta';
    const clues = guide.querySelectorAll('.clue');
    const routeCopy = [
      ['Matrícula','Inscripción y grupos','Elige materias y resuelve cruces antes de confirmar.'],
      ['Horario','Tu semana académica','Consulta clases, aulas y grupos confirmados.'],
      ['Notas','Resultados y proyección','Consulta cortes, definitivas y simulaciones.']
    ];
    clues.forEach((clue,i)=>{
      const [title,subtitle,description] = routeCopy[i];
      clue.querySelector('h3').textContent = title;
      clue.querySelector('p').textContent = subtitle;
      clue.dataset.editionRoute = clue.querySelector('button').dataset.route;
      clue.dataset.editionDescription = description;
    });
    const metrics = document.querySelector('.stats');
    guide.append(metrics);
    board.firstElementChild.innerHTML = '<span class="edition-board-tag"><i></i> MAPA INTERACTIVO</span><span class="eyebrow edition-board-count">03 RUTAS <span>/</span> 01 SEMESTRE</span>';
    const grid = board.querySelector('.crossword');
    const cells = [...grid.children];
    const crossings = { 48: ['matricula','horario'], 70: ['inicio','horario'], 92: ['notas','horario'] };
    Object.entries(crossings).forEach(([index,routes])=>{
      cells[index].classList.add('edition-crossing');
      cells[index].dataset.crossing = routes.join(' ');
    });
    cells.forEach((cell, index) => { if (index < 22 || index >= 99) cell.remove(); });
    const caption = board.querySelector('.row:last-child');
    caption.innerHTML = '<span class="edition-caption" aria-live="polite">Explora una palabra para ver su ruta</span><span class="edition-coord" aria-hidden="true">↗</span>';
    const showRoute = route => {
      const active = [...clues].find(c=>c.dataset.editionRoute===route);
      clues.forEach(c=>c.classList.toggle('edition-active', c===active));
      grid.querySelectorAll('button').forEach((cell,index)=>{
        const linked = route && (cell.dataset.route===route || cell.dataset.crossing?.split(' ').includes(route));
        cell.style.setProperty('--wave', index % 8);
        cell.classList.toggle('edition-linked', Boolean(linked));
      });
      caption.firstElementChild.textContent = active ? active.dataset.editionDescription : 'Explora una palabra para ver su ruta';
    };
    grid.addEventListener('pointerover', e => { const cell=e.target.closest('[data-route]'); if(cell)showRoute(cell.dataset.route); });

  }

  function campusPaper() {
    const access=document.querySelector('.access-screen');
    const board=document.querySelector('.edition-stage .boardwrap');
    const layer=document.createElement('div');
    layer.className='campus-pigment';layer.setAttribute('aria-hidden','true');
    document.body.prepend(layer);
    const blocked='button,a,input,select,label,textarea,table,[role="dialog"],.overlay,.panel,.course,.access-shell,.topbar,.sidebar,.drawer-veil,h1,h2,h3,p,span,footer';
    const free=e=>Boolean(e.target instanceof Element && !e.target.closest(blocked) && !e.target.closest('.boardwrap'));
    const boardFree=e=>Boolean(e.target instanceof Element && board?.contains(e.target) && !e.target.closest('button,.row,p') && (!e.target.closest('span') || e.target.classList.contains('void')));
    const background=paper(layer,free,document);
    const drawing=board?paper(board,boardFree,document):null;
    function change(e){
      if(!free(e)&&!boardFree(e))return;
      ink=(ink+1)%palette.length;distance=0;
      layer.style.setProperty('--active-ink',cssColor(palette[ink].rgb));
      layer.dataset.ink=palette[ink].name;
      (boardFree(e)?drawing:background)?.burst(e);
    }
    document.addEventListener('click',change);
    if(access)access.classList.add('campus-paper-access');
    dispose=()=>{background.destroy();drawing?.destroy();document.removeEventListener('click',change);layer.remove();};
  }

  function star() {
    const form=document.querySelector('#loginForm');
    if(!form)return;
    form.addEventListener('submit',event=>{
      const inputs=[...form.querySelectorAll('input')];
      if(inputs.map(input=>input.value).join('')!=='CRECER')return;
      event.preventDefault();event.stopImmediatePropagation();
      const board=document.querySelector('.access-board');
      if(board.classList.contains('is-unlocking'))return;
      board.classList.add('is-unlocking');
      form.querySelector('button').disabled=true;
      board.querySelector('.access-progress').textContent='Palabra correcta. Abriendo el campus…';
      if(calm()){go('inicio');return;}
      const source=inputs.at(-1).getBoundingClientRect();
      const sx=source.left+source.width/2,sy=source.top+source.height/2;
      const ex=Math.max(40,sx-Math.min(240,innerWidth*.42)),ey=Math.max(50,sy-118);
      const scene=document.createElement('div');scene.className='star-stage';scene.setAttribute('aria-hidden','true');
      document.body.append(scene);
      const make=(className,x,y)=>{const node=document.createElement('i');node.className=className;node.style.left=x+'px';node.style.top=y+'px';scene.append(node);return node;};
      const flight=[{transform:'translate(0,0) scale(.35)',opacity:0},{opacity:1,offset:.25},{transform:`translate(${ex-sx}px,${ey-sy}px) scale(1.08)`,opacity:1}];
      make('star-core',sx,sy).animate(flight,{duration:340,delay:210,easing:'cubic-bezier(.42,0,.3,1)',fill:'both'});
      const angle=Math.atan2(ey-sy,ex-sx)*180/Math.PI+180;
      make('star-streak',sx-78,sy).animate([{transform:`rotate(${angle}deg) scaleX(.1)`,opacity:0},{transform:`translate(${ex-sx}px,${ey-sy}px) rotate(${angle}deg) scaleX(1)`,opacity:1}],{duration:340,delay:210,fill:'both'});
      for(let i=0;i<25;i++){
        const theta=i/25*Math.PI*2,reach=22+Math.random()*50;
        const grain=make('star-grain',ex,ey);grain.style.color=cssColor(palette[i%3].rgb);
        grain.animate([{opacity:0,scale:.25},{opacity:1,offset:.14},{transform:`translate(${Math.cos(theta)*reach}px,${Math.sin(theta)*reach}px)`,scale:.25,opacity:0}],{duration:310,delay:530+(i%3)*12,fill:'both',easing:'ease-out'});
      }
      setTimeout(()=>{scene.remove();if(state.route==='login'&&form.isConnected)go('inicio');},865);
    },true);
  }

  function routePath() {
    const grid=document.querySelector('.edition-stage .crossword');
    if(!grid)return;
    const tiles=[...grid.querySelectorAll('button[data-route]')];
    const info={matricula:['Matrícula','Selecciona materias y revisa los grupos.'],horario:['Horario','Consulta clases, aulas y grupos.'],notas:['Notas','Consulta tus resultados por corte.'],inicio:['CRUZA','Accede a los servicios del campus.']};
    const routeCard=document.querySelector('.route-card');
    const caption=document.querySelector('.edition-caption');
    let active='', touchTile=null;
    tiles.forEach((tile,i)=>{
      const face=document.createElement('span');face.className='tile-face';face.append(...tile.childNodes);tile.append(face);tile.classList.add('route-tile');
      tile.style.setProperty('--fall',`${17+(i*13)%29}px`);
      tile.style.setProperty('--tilt',`${(i*11)%11+(i%2?5:-4)}deg`);
      tile.style.setProperty('--scatter',(i*17)%9);
    });
    const memberships=tile=>tile.dataset.crossing?.split(' ')||[tile.dataset.route];
    function show(route){
      if(route===active)return;
      active=route;
      grid.dataset.path=route;
      let order=0;
      for(const tile of tiles){
        const belongs=route && memberships(tile).includes(route);
        tile.classList.toggle('is-path',Boolean(belongs));tile.classList.toggle('is-floor',Boolean(route&&!belongs));
        tile.classList.toggle('is-lit',Boolean(belongs));tile.classList.toggle('edition-linked',Boolean(belongs));
        if(belongs)tile.style.setProperty('--lift',order++);
      }
      const [title,description]=info[route||'matricula'];
      routeCard.querySelector('h3').textContent=title;
      routeCard.querySelector('p').textContent=description;
      const button=routeCard.querySelector('button');button.dataset.route=route||'matricula';button.textContent=route==='inicio'?'Abrir menú →':`Abrir ${title} →`;
      caption.textContent=route?description:'Explora una palabra para ver su ruta';
    }
    function point(event){
      event.stopImmediatePropagation();
      const tile=event.target.closest('.route-tile');
      if(tile)show(active&&memberships(tile).includes(active)?active:tile.dataset.route);
    }
    grid.addEventListener('pointerover',point,true);
    grid.addEventListener('focusin',point,true);
    grid.addEventListener('pointerout',e=>e.stopImmediatePropagation(),true);
    grid.addEventListener('pointerleave',e=>{if(e.target!==grid)return;e.stopImmediatePropagation();if(e.pointerType!=='touch')show('');},true);
    grid.addEventListener('focusout',e=>{e.stopImmediatePropagation();if(!grid.contains(e.relatedTarget)&&!routeCard.contains(e.relatedTarget)&&!grid.matches(':hover'))show('');},true);
    grid.addEventListener('pointerdown',e=>{touchTile=e.pointerType==='touch'?e.target.closest('.route-tile'):null;},true);
    grid.addEventListener('click',e=>{
      const tile=e.target.closest('.route-tile');
      if(tile && touchTile===tile && !tile.dataset.crossing && tile.dataset.route!=='inicio'){e.stopPropagation();show(tile.dataset.route);}
      touchTile=null;
    },true);
  }

  const base = render;
  render=function(){
    dispose();dispose=()=>{};
    base();
    campusPaper();
    if(state.route==='login')star();
    if(state.route==='inicio')routePath();
  };
  render();
})();
</script><script>(() => {
  'use strict';
  const moduleNames={inicio:'Mi tablero',matricula:'Inscripción',horario:'Horario',notas:'Notas',historial:'Historial',calendario:'Calendario',avisos:'Avisos',perfil:'Perfil'};
  const tints={login:'#eadcf4',inicio:'#dfd3f0',matricula:'#e1eac7',horario:'#dce9ed',notas:'#eadcf1',calendario:'#f4e0ca',avisos:'#f3e1d7',historial:'#e2e9d0',perfil:'#e7e2f1'};
  let projection='web';
  const base=render;
  const safe=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function access() {
    const grid=document.querySelector('.access-grid');
    for(const [letter,row] of [['M',2],['T',4],['A',5]])grid.insertAdjacentHTML('afterbegin',`<span class="access-fixed" data-word="meta" style="grid-row:${row}" aria-hidden="true">${letter}</span>`);
    document.querySelector('#letter4').setAttribute('aria-label','Letra 5 de 6, cruce con META');
    document.querySelector('.access-board h2 + p').textContent='Pista: aprender y avanzar. Cruces con CURSO y META.';
  }
  function header(route) {
    const top=document.querySelector('.topbar');
    top.classList.add('campus-header');
    top.insertAdjacentHTML('afterbegin',`<div class="campus-ident"><i aria-hidden="true"><span></span><span></span><span></span><span></span></i><b>cruza.</b><small>${moduleNames[route]}</small></div><span class="campus-period">2026–2</span>`);
    const back=top.querySelector('.campus-back');
    if(back)back.textContent='← Tablero';
    top.querySelector('.campus-menu').textContent='☰ Menú';
  }
  function dashboard() {
    const heading=document.querySelector('.edition-title');
    heading.querySelector('h1').textContent='Mi tablero';
    heading.querySelector('p').remove();
    heading.querySelector('.edition-kicker').textContent='PORTAL ACADÉMICO';
    const [count,credits,average]=document.querySelectorAll('.edition-guide .stat');
    count.querySelector('.eyebrow').textContent=state.confirmed?'Materias inscritas':'Plan sugerido';
    count.querySelector('small').textContent='materias';
    credits.querySelector('.eyebrow').textContent='Créditos del período';
    credits.querySelector('small').textContent=state.confirmed?'confirmados':'del plan sugerido';
    average.querySelector('small').textContent='ponderado por créditos';
    const secondary=document.querySelector('.edition-home .v2-grid section:first-child h2');
    if(secondary)secondary.textContent=state.confirmed?'Materias inscritas':'Materias sugeridas';
    document.querySelector('.edition-guide>.row h2').textContent='Rutas académicas';
  }
  function calendar() {
    const kinds={10:['campus','Evento'],16:['entrega','Entrega'],20:['evaluacion','Evaluación'],27:['campus','Evento']};
    const grid=document.querySelector('.v2-calendar');
    grid.insertAdjacentHTML('beforebegin','<div class="calendar-legend"><span data-kind="campus">Evento</span><span data-kind="entrega">Entrega</span><span data-kind="evaluacion">Evaluación</span></div>');
    for(const btn of grid.querySelectorAll('[data-v2-date]')){
      const day=btn.dataset.v2Date;
      if(!kinds[day])continue;
      btn.dataset.kind=kinds[day][0];
      const entry=document.querySelector(`.v2-list [data-v2-date="${day}"]`);
      btn.dataset.saved=String(entry?.textContent.includes('Guardado')||false);
      btn.setAttribute('aria-label',`${day} de noviembre · ${kinds[day][1]}${btn.dataset.saved==='true'?' · Guardado':''}`);
    }
    const list=document.querySelector('main .v2-list');
    list.insertAdjacentHTML('beforebegin','<div class="calendar-next"><h3>Próximos compromisos</h3></div>');
    const active=grid.querySelector('[aria-pressed=true]')?.dataset.v2Date;
    const current=list.querySelector(`[data-v2-date="${active}"]`);
    if(current)current.closest('li').remove();
    const slot={10:'09:00 · Auditorio',16:'23:59 · Aula virtual',20:'10:00 · C-204',27:'17:00 · Aula virtual'}[active];
    if(slot)document.querySelector('main [data-v2-remind]').insertAdjacentHTML('beforebegin',`<p class="mini muted">${slot}</p>`);
    document.querySelector('.heading h1').textContent='Calendario académico';
  }
  const cutNames=['Corte 1','Corte 2','Corte 3'];
  const weights=[30,30,40];
  const gradeRows=()=>[...document.querySelectorAll('.grades tbody tr')].map(row=>({row,course:courses.find(c=>c.name===row.querySelector('b')?.textContent)})).filter(item=>item.course);
  function updateProjection() {
    const selected=document.querySelector('#projection-course');
    const slider=document.querySelector('#sim');
    const course=courses.find(c=>c.id===selected?.value);
    if(!course||!slider)return;
    projection=course.id;
    const value=Number(slider.value);
    document.querySelector('#simValue').textContent=fmt(value);
    document.querySelector('#simResult').textContent=fmt(course.grades[0]*.3+course.grades[1]*.3+value*.4);
    document.querySelector('.grades-weights').textContent=`Corte 1: ${fmt(course.grades[0])} (30 %) · Corte 2: ${fmt(course.grades[1])} (30 %) · Corte 3 simulado (40 %)`;
  }
  function gradesPage() {
    document.querySelector('.heading h1').textContent='Calificaciones';
    document.querySelector('.heading p').textContent='Consulta los cortes, las evaluaciones por docente y la nota proyectada.';
    const items=gradeRows();
    const recorded=items.filter(({course})=>campusAcademic.published(course.id));
    document.querySelector('.grades').insertAdjacentHTML('beforebegin',`<div class="grades-summary"><span class="badge">${recorded.length} con resultados</span><span class="badge">${items.length-recorded.length} pendientes</span><span class="badge">${state.cut==='final'?'Definitivas':`${cutNames[+state.cut]} · ${weights[+state.cut]} %`}</span></div>`);
    for(const {row,course} of items)row.cells[0].insertAdjacentHTML('beforeend',`<button class="grade-detail-btn" data-eval="${course.id}" aria-label="Ver evaluaciones de ${safe(course.name)}">Ver evaluaciones ↗</button>`);
    document.querySelector('.gradegrid .clue')?.remove();
    const sim=document.querySelector('#sim').closest('.panel');
    sim.querySelector('h3').textContent='Simulador de corte';
    sim.querySelector('h3 + p').className='grades-weights';
    sim.querySelector('h3').insertAdjacentHTML('afterend',`<label for="projection-course" class="mini">Materia</label><select id="projection-course" class="projection-select">${recorded.map(({course})=>`<option value="${course.id}">${safe(course.name)}</option>`).join('')}</select>`);
    const select=sim.querySelector('select');if(recorded.some(({course})=>course.id===projection))select.value=projection;
    updateProjection();
  }
  function evaluations(id) {
    const c=courses.find(course=>course.id===id);if(!c)return;
    const published=campusAcademic.published(id);
    const group=campusAcademic.group(id);
    const teacher=published?c.teacher:group.teacher;
    const displayedGroup=published?'A':group.group;
    const selected=state.cut==='final'?[0,1,2]:[+state.cut];
    const table=selected.map(i=>{
      const names=['Taller aplicado','Evaluación de corte'];
      const dates=[['19 ago','02 sep'],['23 sep','07 oct'],['28 oct','11 nov']][i];
      const step=Math.min(.2,c.grades[i],5-c.grades[i]);
      return `<section><h3>${cutNames[i]} · ${weights[i]} % del período</h3><table class="eval-table"><thead><tr><th>Evaluación</th><th>Fecha</th><th>Peso</th><th>Estado</th><th>Nota</th></tr></thead><tbody>${names.map((name,n)=>`<tr><td>${name}</td><td>${dates[n]}</td><td>50 %</td><td>${published?'Publicada':'Pendiente'}</td><td>${published?fmt(c.grades[i]+(n===0?-step:step)):'—'}</td></tr>`).join('')}</tbody></table><p class="mini muted">${published?`Resultado del corte: ${fmt(c.grades[i])}`:'Sin calificaciones publicadas'}</p></section>`;
    }).join('');
    modal(`<h2 id="modalTitle">${safe(c.name)}</h2><div class="eval-meta"><span class="badge">Docente · ${safe(teacher)}</span><span class="badge">${published?'Registro · ':''}Grupo ${displayedGroup}</span></div>${table}`);
  }
  function enrollment() {
    const steps=document.querySelector('.steps');
    if(steps)steps.innerHTML='<span>01 SELECCIÓN</span><span>→ 02 REVISIÓN</span><span>→ 03 CONFIRMACIÓN</span>';
    document.querySelectorAll('.enroll .course').forEach(card=>{
      card.classList.add('campus-course');
      card.querySelector('.eyebrow')?.remove();
      card.querySelector('p.muted')?.remove();
    });
    const aside=document.querySelector('.enroll aside');
    aside.querySelector('.eyebrow').textContent='RESUMEN DE INSCRIPCIÓN';
    aside.querySelector('h2').textContent=`${state.selected.length} materias seleccionadas`;
    if(aside.querySelector('.conflict-detail'))aside.querySelectorAll('[aria-live] .error').forEach(el=>el.hidden=true);
    const end=aside.querySelector(':scope > p:last-child');
    if(end)end.textContent='Máximo de la demostración: 18 créditos.';
  }
  render=function(){
    base();
    const route=state.route;
    document.body.style.setProperty('--campus-tint',tints[route]||tints.inicio);
    if(route==='login'){access();return;}
    header(route);
    if(route==='inicio')dashboard();
    if(route==='calendario')calendar();
    if(route==='notas')gradesPage();
    if(route==='matricula')enrollment();
  };
  document.addEventListener('input',e=>{if(e.target.id==='sim'||e.target.id==='projection-course')updateProjection();});
  document.addEventListener('change',e=>{if(e.target.id==='projection-course')updateProjection();});
  document.addEventListener('click',e=>{
    const btn=e.target.closest('[data-eval]');
    if(btn)evaluations(btn.dataset.eval);
    if(e.target.closest('[data-action="review"]'))document.querySelectorAll('.draft-diff li').forEach(row=>row.dataset.change=row.textContent.split(' ')[0].toLowerCase());
    if(e.target.closest('[data-crossing]')){
      const option=document.querySelector('[data-cross-open="inicio"]');
      if(option)option.textContent='CRUZA · Abrir menú →';
    }
  });
  const observer=new MutationObserver(()=>{
    const option=document.querySelector('[data-cross-open="inicio"]');
    if(option&&option.textContent!=='CRUZA · Abrir menú →')option.textContent='CRUZA · Abrir menú →';
    document.querySelectorAll('.draft-diff li:not([data-change])').forEach(row=>row.dataset.change=row.textContent.split(' ')[0].toLowerCase());
  });
  observer.observe(document.body,{childList:true,subtree:true});
  render();
})();
</script></body></html>
