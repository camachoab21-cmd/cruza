<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crucigrama del campus · CRUZA</title>
  <link rel="stylesheet" href="/static/cruza-crucigrama.css">
  <script defer src="/static/cruza-crucigrama.js"></script>
</head>
<body>
  <main>
    <a href="/" class="return">← Volver al campus</a>
    <h1>Crucigrama del campus</h1>
    <p>Puedes jugar sin conexión. Escribe una letra por casilla.</p>
    <form id="crossword" autocomplete="off">
      <div class="game">
        <div id="grid" role="group" aria-label="Casillas del crucigrama"></div>
        <section aria-labelledby="clues">
          <h2 id="clues">Pistas</h2>
          <p><strong>1 ↓</strong> Una materia que estudias durante el semestre.</p>
          <p><strong>2 →</strong> El nombre de tu campus académico.</p>
          <p><strong>3 ↓</strong> El lugar donde tienes clase.</p>
        </section>
      </div>
      <div class="actions">
        <button type="submit">Comprobar</button>
        <button type="reset">Reiniciar</button>
      </div>
      <p id="result" role="status"></p>
    </form>
    <noscript>Activa JavaScript para jugar.</noscript>
  </main>
</body>
</html>
